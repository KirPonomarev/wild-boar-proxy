name: Repo Hygiene

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python3 -m pip install --upgrade pytest

      - name: Compile repo hygiene guard
        run: python3 -m compileall -q tools/check_repo_hygiene.py tests/test_repo_hygiene.py

      - name: Test repo hygiene guard
        run: python3 -m pytest tests/test_repo_hygiene.py -q

      - name: Run repo hygiene range guard
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          if [[ "$base" =~ ^0+$ ]]; then
            default_branch="${{ github.event.repository.default_branch }}"
            git fetch --no-tags origin "${default_branch}:refs/remotes/origin/${default_branch}"
            base="$(git merge-base "origin/${default_branch}" "$head")"
          fi

          python3 tools/check_repo_hygiene.py --git-range "${base}..${head}"
